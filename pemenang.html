<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2345">
  <title>Keputusan Kajian Tindakan</title>
  <style>
    :root{--navy:#0b2345;--blue:#1769aa;--gold:#c69a2d;--ink:#142033;--muted:#607086;--line:#dce5ef;--surface:rgba(255,255,255,.9);--shadow:0 18px 46px rgba(14,35,66,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#edf3f8;color:var(--ink);font:16px/1.5 Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}.page{min-height:100vh;display:flex;flex-direction:column}
    header{background:var(--navy);color:#fff;padding:20px max(18px,env(safe-area-inset-left));box-shadow:0 7px 24px rgba(3,19,42,.22)}.head{width:min(1050px,100%);margin:auto}.head small{color:#bfd2e8;letter-spacing:.11em;text-transform:uppercase}.head h1{font-size:clamp(1.3rem,4vw,2rem);margin:4px 0 0}
    main{width:min(1050px,calc(100% - 28px));margin:28px auto 45px;flex:1}.panel{background:var(--surface);border:1px solid #fff;border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.intro{border-left:6px solid var(--gold);padding-left:18px;margin-bottom:20px}.intro h2{margin:0}.intro p{color:var(--muted);margin:5px 0 0}.status{padding:13px 15px;border-radius:13px;background:#eaf4fc;color:var(--navy);font-weight:800;margin-bottom:15px}.ranking{display:grid;gap:11px}.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:15px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.rank{width:50px;height:50px;display:grid;place-items:center;border-radius:14px;background:var(--navy);color:#fff;font-weight:950}.main h3{font-size:.98rem;margin:0;overflow-wrap:anywhere}.main p{color:var(--muted);font-size:.82rem;margin:5px 0 0}.total{text-align:right}.total b{display:block;color:var(--blue);font-size:1.35rem}.total small{color:var(--muted)}.loading{text-align:center;color:var(--muted);padding:32px}.error{background:#fff1f0;color:#9f2119;padding:16px;border-radius:13px}.retry{border:0;border-radius:11px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:850;cursor:pointer;margin-top:12px}
    footer{background:#fff;border-top:1px solid var(--line);padding:24px 18px calc(24px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:.82rem}.footer-logo{display:block;width:min(390px,88vw);max-height:100px;object-fit:contain;margin:0 auto 12px}
    @media(max-width:720px){main{width:min(100% - 18px,1050px);margin-top:16px}.panel{padding:16px}.row{grid-template-columns:50px minmax(0,1fr);gap:9px;padding:12px}.rank{width:42px;height:42px}.total{grid-column:2;text-align:left}.main h3{font-size:.9rem}}
  </style>
</head>
<body>
<div class="page">
  <header><div class="head"><small>Unit Sumber Teknologi Pendidikan PPDPU</small><h1>Keputusan Kajian Tindakan 2026</h1></div></header>
  <main><section class="panel"><div class="intro"><h2>Ranking keseluruhan</h2><p>Disusun mengikut jumlah terkumpul semua hakim, bukan purata. Paparan ini read-only.</p></div><div id="content" class="loading">Memuatkan keputusan semasa…</div></section></main>
  <footer><img class="footer-logo" src="logo-puice-set.png" alt="Logo rasmi dan rakan strategik"><div>© Unit Sumber Teknologi Pendidikan PPDPU · Kajian Tindakan 2026</div></footer>
</div>
<script>
const LIVE_API='https://script.google.com/macros/s/AKfycbyPEDmLrml3CrTswfq45dJaKpWoOuW-jNX_cL0LbwWVc5LfIOfCHmG5Q3BmH_0YrQW3qw/exec';
const API_URL=location.hostname==='localhost'||location.hostname==='127.0.0.1'?'/api':LIVE_API;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function api(url){let last;for(let attempt=0;attempt<3;attempt++){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(url,{signal:controller.signal});const type=response.headers.get('content-type')||'';if(!response.ok)throw new Error('Sambungan sementara terganggu.');if(!type.includes('application/json'))throw new Error('Respons sistem tidak dapat dibaca.');return await response.json()}catch(error){last=error;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,600*(attempt+1)))}finally{clearTimeout(timer)}}throw last}
async function load(){const content=document.querySelector('#content');content.className='loading';content.textContent='Memuatkan keputusan semasa…';try{const result=await api(API_URL+'?action=winners&t='+Date.now());if(!result.success||!result.published)throw new Error(result.message||'Keputusan belum tersedia.');const p=result.progress,status=p.complete?'Semua '+p.expected+' penilaian telah diterima.':'Keputusan semasa: '+p.received+' daripada '+p.expected+' penilaian diterima. Kedudukan boleh berubah.';content.className='';content.innerHTML='<div class="status">'+esc(status)+'</div><div class="ranking">'+result.ranked.map(item=>'<article class="row"><div class="rank">#'+item.rank+'</div><div class="main"><h3>'+esc(item.tajuk)+'</h3><p>'+esc(String(item.namaPeserta).replace(/\n/g,', '))+' · '+esc(item.sekolah)+' · '+esc(item.bidang)+'</p></div><div class="total"><b>'+item.total+'</b><small>jumlah · '+item.judgesReceived+'/3 hakim</small></div></article>').join('')+'</div>'}catch(error){content.className='error';content.innerHTML=esc(error.message||'Keputusan belum dapat dimuatkan.')+'<br><button class="retry" type="button" onclick="load()">Cuba lagi</button>'}}
load();
</script>
</body>
</html>
